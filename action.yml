name: Twitter Post
description: >
  Reads recent blog posts, generates tweets via Claude,
  and posts to Twitter/X via Zernio — automatically.

inputs:
  anthropic_api_key:
    description: Anthropic API key for Claude
    required: true
  github_token:
    description: GitHub token with repo permissions (to commit history)
    required: true
  zernio_api_key:
    description: Zernio API key (sk_...)
    required: true
  twitter_account_id:
    description: "Zernio account ID for the Twitter account (acc_...). If omitted, uses the first connected Twitter account."
    default: ""
  site_url:
    description: The site's public URL (e.g. https://semguns.com)
    required: true
  brand_voice:
    description: Short description of the brand voice for tweet generation
    default: ""
  posts_per_run:
    description: Number of tweets to post per run
    default: "1"
  dry_run:
    description: "true to generate tweets without posting"
    default: "false"

runs:
  using: composite
  steps:
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Install action dependencies
      shell: bash
      run: npm ci
      working-directory: ${{ github.action_path }}

    - name: Checkout site repo
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Run Twitter post pipeline
      shell: bash
      run: node ${{ github.action_path }}/scripts/main.mjs
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic_api_key }}
        GITHUB_TOKEN: ${{ inputs.github_token }}
        ZERNIO_API_KEY: ${{ inputs.zernio_api_key }}
        TWITTER_ACCOUNT_ID: ${{ inputs.twitter_account_id }}
        GITHUB_REPO: ${{ github.repository }}
        SITE_URL: ${{ inputs.site_url }}
        BRAND_VOICE: ${{ inputs.brand_voice }}
        POSTS_PER_RUN: ${{ inputs.posts_per_run }}
        DRY_RUN: ${{ inputs.dry_run }}
